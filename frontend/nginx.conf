server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Default nginx client_max_body_size is 1MB, which silently 413's any
    # upload bigger than that — PDFs/images in casual testing often slip
    # under 1MB so this goes unnoticed, but MP3/WAV audio files routinely
    # exceed it, so every audio upload was rejected before it ever reached
    # the FastAPI backend. Raised to cover multi-file batches of larger
    # audio/video-adjacent uploads.
    client_max_body_size 200M;

    # React Router client-side routing — always fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the backend container (same-origin from the
    # browser's point of view, so no CORS/host config needed per machine).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # SSE streaming (chat responses) needs buffering off
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
